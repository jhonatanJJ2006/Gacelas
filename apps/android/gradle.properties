org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KMP: en Linux/Windows los targets iOS se omiten sin error (solo compilan en macOS).
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Velocidad de compilacion (local y CI)
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx2g
# Kotlin/Native: cache estatica de dependencias (se guarda en ~/.konan, cacheada en CI).
kotlin.native.cacheKind=static
# SHA-1 de las firmas registradas en Google Cloud (cliente OAuth Android com.gacelas).
# Un APK publicado con otra firma no puede iniciar sesion con Google. Ver docs/REGRESIONES.md.
gacelas.firmasGoogle=23:CF:7D:D7:5A:19:B1:54:13:99:38:AD:62:61:DE:AA:BE:DC:23:F9,F1:A2:7B:EE:15:19:B9:5D:DB:88:AD:77:4F:5E:0E:08:5F:9F:45:D1,19:85:26:6B:79:BB:75:61:1C:AB:96:19:F7:E4:65:08:1C:CC:C2:7F
# Firma unica de las actualizaciones desde v0.9.18. El keystore F1:A2 (v0.9.12 a v0.9.17) se perdio;
# el nuevo esta fuera del repo, documentado en docs/SUPABASE.md. Android no instala un APK encima de
# otro si el certificado cambia (INSTALL_FAILED_UPDATE_INCOMPATIBLE). No publiques con otra huella.
gacelas.firmaPublicacion=19:85:26:6B:79:BB:75:61:1C:AB:96:19:F7:E4:65:08:1C:CC:C2:7F
