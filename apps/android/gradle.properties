org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KMP: en Linux/Windows los targets iOS se omiten sin error (solo compilan en macOS).
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Velocidad de compilacion (local y CI)
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx2g
# Kotlin/Native: cache estatica de dependencias (se guarda en ~/.konan, cacheada en CI).
kotlin.native.cacheKind=static
