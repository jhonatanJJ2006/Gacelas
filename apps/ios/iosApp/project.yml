name: iosApp
options:
  bundleIdPrefix: com.gacelas
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "700"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # Mismas imagenes que Android (shared/src/androidMain/res), copiadas al bundle.
      - path: ../../android/shared/src/androidMain/res/drawable-nodpi/mapa_stitch_bienvenida.webp
        buildPhase: resources
      - path: ../../android/shared/src/androidMain/res/drawable-nodpi/mapa_stitch_login.webp
        buildPhase: resources
      - path: ../../android/shared/src/androidMain/res/drawable/ic_google_g.xml
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Gacelas
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: Gacelas usa tu ubicación para medir distancia, ritmo y ruta de tus carreras.
        NSLocationAlwaysAndWhenInUseUsageDescription: Gacelas sigue registrando tu carrera con la pantalla apagada o en segundo plano.
        NSMotionUsageDescription: Gacelas usa la brújula y el movimiento para orientar el mapa hacia donde miras.
        UIBackgroundModes: [location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gacelas.app
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../android/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Firma: se añadirá con secretos (DEVELOPMENT_TEAM, perfil) en la etapa TestFlight
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Compilar Shared (KMP)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../../android"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
