name: CI

on:
  push:
    branches: [main, develop]
    paths:
      # Web/backend/docs. Kotlin y Swift no afectan a este CI; sus .md/.json si (prettier).
      - '**'
      - '!apps/android/**'
      - '!apps/ios/**'
      - 'apps/**/*.md'
      - 'apps/**/*.json'
  pull_request:
    branches: [main, develop]
    paths:
      - '**'
      - '!apps/android/**'
      - '!apps/ios/**'
      - 'apps/**/*.md'
      - 'apps/**/*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  format:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint code
        run: pnpm lint

      - name: Lint documentation
        run: pnpm lint:docs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit
