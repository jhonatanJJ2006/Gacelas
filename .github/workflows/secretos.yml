name: Secretos

# Escanea secretos en cada pull request y en cada push a main.
# No imprime el valor: gitleaks corre con --redact. Si falla, el log muestra
# archivo y regla. La anon key y la clave publishable de Supabase se explican
# en .gitleaks.toml: son públicas por diseño y no deben romper este job.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Traer la rama base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            *[!A-Za-z0-9._/-]*|"") echo "base_ref inesperado"; exit 1 ;;
          esac
          git fetch --no-tags origin "$BASE_REF"

      - name: Instalar gitleaks
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear archivos actuales
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

      - name: Escanear commits del evento
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          es_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            es_sha "$BASE_SHA" && es_sha "$HEAD_SHA" || { echo "SHA inesperado"; exit 1; }
            rango="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            es_sha "$HEAD_SHA" || { echo "SHA inesperado"; exit 1; }
            rango="-n 1"
          else
            es_sha "$BEFORE_SHA" && es_sha "$HEAD_SHA" || { echo "SHA inesperado"; exit 1; }
            rango="$BEFORE_SHA..$HEAD_SHA"
          fi
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts="$rango"
